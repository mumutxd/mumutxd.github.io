<body>

  <header class="ust-bar">
    <a class="imza" href="index.html">Umut Seçkin</a>
    <button class="menu-dugme" type="button" id="menuAc" aria-expanded="false" aria-controls="menu">Menü</button>
  </header>

  <nav class="menu-katman" id="menu" data-acik="false" aria-label="Ana menü">
    <button class="menu-kapat" type="button" id="menuKapat">Kapat</button>

    <a class="menu-baglanti" href="hakkimda.html" style="--i:3">Hakkımda</a>
    <a class="menu-baglanti" href="iletisim.html" style="--i:4">İletişim</a>
  </nav>

  <main>
    <section class="bolum bolum--ilk">
      <div class="motif motif--tepe" aria-hidden="true"><img class="motif-ic" src="gorseller/kertenkele.png" alt="" data-hiz="0.15" data-fare="10"></div>

      <div class="kabuk">
        <div class="bolum-basi anim">
          <p class="etiket">2024 — 2026</p>
          <h1 class="sayfa-baslik">Projelerim</h1>
        </div>

        <div class="izgara">

          <figure class="proje anim">
            <div class="proje-gorsel">
              <img src="gorseller/orka.jpg" alt="ORKA enerji içeceği kutu serisi, üç boyutlu ürün görseli">
            </div>
            <figcaption>
              <div class="proje-bilgi">
                <h2 class="proje-ad">ORKA Enerji İçeceği</h2>
                <span class="proje-yil">2026 · Marka &amp; 3B</span>
              </div>
              <p class="proje-aciklama">Kurgusal bir enerji içeceği markası. Piksel maskot, üç aromalı kutu serisi ve 3B ürün görselleştirmesi; ambalaj tipografisi kutu başına aroma paletinden türüyor.</p>
            </figcaption>
          </figure>

          <figure class="proje anim" style="--gecikme:.12s">
            <div class="proje-gorsel">
              <img src="gorseller/eagicy.jpg" alt="EAGICY moda koleksiyonu afişi" class="odak-orta">
            </div>
            <figcaption>
              <div class="proje-bilgi">
                <h2 class="proje-ad">EAGICY</h2>
                <span class="proje-yil">2025 · Afiş</span>
              </div>
              <p class="proje-aciklama">Bir sokak giyim koleksiyonu için lookbook afişi. Soğuk mavi fotoğrafın üzerinde asit yeşili display tipografi; küçük metin blokları kadrajın içine yerleşiyor.</p>
            </figcaption>
          </figure>

          <figure class="proje proje--kucuk anim">
            <div class="proje-gorsel">
              <img src="gorseller/shining.jpg" alt="The Shining filmi için grafiti dokulu afiş yorumu">
            </div>
            <figcaption>
              <div class="proje-bilgi">
                <h2 class="proje-ad">The Shining · Overlook</h2>
                <span class="proje-yil">2024 · Afiş</span>
              </div>
            </figcaption>
          </figure>

          <figure class="proje proje--kucuk anim" style="--gecikme:.08s">
            <div class="proje-gorsel">
              <img src="gorseller/internet.jpg" alt="İnternet Gençleri Öldürdü başlıklı yarım ton baskı afiş">
            </div>
            <figcaption>
              <div class="proje-bilgi">
                <h2 class="proje-ad">İnternet Gençleri Öldürdü</h2>
                <span class="proje-yil">2025 · Afiş</span>
              </div>
            </figcaption>
          </figure>

          <figure class="proje proje--kucuk anim" style="--gecikme:.16s">
            <div class="proje-gorsel">
              <img src="gorseller/hurriler.jpg" alt="Hurriler uygarlığını anlatan bilgilendirme tasarımı" class="odak-ust">
            </div>
            <figcaption>
              <div class="proje-bilgi">
                <h2 class="proje-ad">Hurriler</h2>
                <span class="proje-yil">2025 · Bilgilendirme</span>
              </div>
            </figcaption>
          </figure>

          <figure class="proje proje--kucuk anim" style="--gecikme:.24s">
            <div class="proje-gorsel">
              <img src="gorseller/tipografi.jpg" alt="Umut Tasarım yazılı deforme harflerle kurulmuş tipografik afiş">
            </div>
            <figcaption>
              <div class="proje-bilgi">
                <h2 class="proje-ad">Umut Tasarım</h2>
                <span class="proje-yil">2024 · Tipografi</span>
              </div>
            </figcaption>
          </figure>

        </div>
      </div>
    </section>

    </div>
